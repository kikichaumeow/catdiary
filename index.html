<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貓貓日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E1CE;
    --paper-2:#F1ECDD;
    --card:#FBF8EE;
    --ink:#2E3A34;
    --ink-soft:#66756C;
    --moss:#748569;
    --tabby:#C07C3E;
    --tabby-dark:#8C5A28;
    --brick:#A85843;
    --clinical:#4F7285;
    --line:rgba(46,58,52,.16);
    --line-strong:rgba(46,58,52,.28);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(46,58,52,.05) 1px, transparent 0);
    background-size:14px 14px;
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px;}
  .masthead{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:20px;
    flex-wrap:wrap;gap:10px;
  }
  .masthead h1{
    font-family:'Noto Serif TC',serif;font-weight:700;
    font-size:26px;margin:0;letter-spacing:.04em;color:var(--ink);
  }
  .masthead .sub{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
  }
  .cattabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .cattab{
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;border-radius:3px 3px 0 0;
    border:1px solid var(--line-strong);border-bottom:none;
    background:var(--paper-2);cursor:pointer;
    font-size:14px;color:var(--ink-soft);
    position:relative;top:1px;
  }
  .cattab.active{
    background:var(--card);color:var(--ink);font-weight:500;
    border-color:var(--ink);
    box-shadow:0 -2px 0 0 var(--catcolor,var(--tabby)) inset;
  }
  .cattab .dot{width:9px;height:9px;border-radius:50%;background:var(--catcolor,var(--tabby));flex-shrink:0;}
  .cattab .delcat{
    margin-left:2px;color:var(--ink-soft);font-size:11px;line-height:1;
    padding:2px 4px;border-radius:50%;cursor:pointer;
  }
  .cattab .delcat:hover{color:#fff;background:var(--brick);}
  .cattab.addnew{
    color:var(--tabby-dark);border-style:dashed;background:transparent;
    font-weight:500;
  }
  .addcat-form{
    display:flex;gap:8px;margin:-14px 0 22px;padding:14px;
    background:var(--card);border:1px solid var(--line-strong);
    border-radius:0 4px 4px 4px;flex-wrap:wrap;align-items:center;
  }
  .addcat-form input[type=text]{flex:1;min-width:140px;}
  .swatches{display:flex;gap:6px;}
  .swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.sel{border-color:var(--ink);}

  .board{background:var(--card);border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;}
  .datebar{
    display:flex;align-items:center;justify-content:center;gap:16px;
    padding:14px;border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
  }
  .datebar button{
    background:none;border:1px solid var(--line-strong);width:30px;height:30px;
    border-radius:50%;cursor:pointer;color:var(--ink);font-size:15px;line-height:1;
  }
  .datebar button:hover{background:var(--paper-2);}
  .datebar .datelabel{font-size:15px;font-weight:600;min-width:170px;text-align:center;}
  .datebar .today-btn{
    font-family:'Noto Sans TC',sans-serif;font-size:12px;border-radius:14px;
    width:auto;padding:0 12px;height:26px;color:var(--tabby-dark);border-color:var(--tabby);
  }

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);}
  .stat{background:var(--card);padding:12px 14px;}
  .stat .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--ink);}
  .stat .l{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .grid{display:grid;grid-template-columns:1.1fr 1.4fr;gap:0;}
  .panel{padding:18px 20px;}
  .panel.stamps{border-right:1px solid var(--line);}
  .panel h2{
    font-family:'Noto Serif TC',serif;font-size:14px;margin:0 0 12px;
    color:var(--ink-soft);font-weight:600;letter-spacing:.05em;
  }
  .stampgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .stampbtn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 3px;border:1.5px solid var(--line-strong);border-radius:6px;
    background:var(--paper-2);cursor:pointer;color:var(--catcolor,var(--tabby));
    transition:transform .1s ease;
  }
  .stampbtn:hover{border-color:currentColor;background:var(--card);}
  .stampbtn:active{transform:scale(.95);}
  .stampbtn.on{background:var(--card);border-color:currentColor;box-shadow:0 0 0 1px currentColor inset;}
  .stampbtn svg{width:19px;height:19px;}
  .stampbtn span{font-size:10.5px;color:var(--ink);font-weight:500;}

  .quickform{
    margin-top:14px;padding:14px;background:var(--paper-2);
    border:1px dashed var(--line-strong);border-radius:6px;
  }
  .quickform .frow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .quickform label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .quickform .fitem{flex:1;min-width:110px;}
  input,select,textarea{
    width:100%;font-family:inherit;font-size:13px;color:var(--ink);
    border:1px solid var(--line-strong);border-radius:4px;padding:7px 8px;
    background:var(--card);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--tabby);outline-offset:-1px;}
  textarea{resize:vertical;min-height:44px;}
  .stampsubmit{
    margin-top:8px;width:100%;padding:9px;border-radius:4px;border:none;
    background:var(--catcolor,var(--tabby));color:#fff;font-weight:600;
    cursor:pointer;font-size:13px;letter-spacing:.03em;
  }
  .stampsubmit:hover{filter:brightness(1.08);}

  .timeline{padding:18px 20px;min-height:260px;}
  .empty{
    color:var(--ink-soft);font-size:13px;text-align:center;padding:40px 10px;
    font-family:'Noto Serif TC',serif;
  }
  .entry{
    display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);
    animation:stampIn .28s ease-out;
  }
  .entry:last-child{border-bottom:none;}
  @keyframes stampIn{
    0%{opacity:0;transform:scale(1.5) rotate(-8deg);}
    60%{opacity:1;}
    100%{opacity:1;transform:scale(1) rotate(var(--tilt,-2deg));}
  }
  .stampicon{
    width:34px;height:34px;flex-shrink:0;color:var(--c,var(--tabby));
    filter:url(#inkTexture);transform:rotate(var(--tilt,-2deg));
  }
  .entrybody{flex:1;min-width:0;}
  .entrytop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .entrytype{font-weight:500;font-size:13.5px;}
  .entrytime{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .entrydetail{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .entrynote{font-size:12.5px;color:var(--ink);margin-top:3px;font-style:italic;}
  .wdiff{font-weight:600;}
  .wdiff.up{color:var(--tabby-dark);}
  .wdiff.down{color:var(--clinical);}
  .wdiff.same{color:var(--ink-soft);font-weight:500;}
  .lastweight{font-size:12px;color:var(--ink-soft);margin-bottom:8px;padding:6px 8px;background:var(--card);border-radius:4px;border:1px solid var(--line);}
  .bloodsection-title{font-size:12px;font-weight:600;color:var(--ink);margin:10px 0 4px;font-family:'Noto Serif TC',serif;}
  .bloodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 10px;margin-bottom:6px;}
  .bloodgrid .bitem{display:flex;flex-direction:column;}
  .bloodgrid label{font-size:10px;color:var(--ink-soft);margin-bottom:2px;display:flex;justify-content:space-between;gap:4px;line-height:1.2;}
  .bloodgrid label .ref{font-family:'IBM Plex Mono',monospace;font-size:9px;opacity:.7;white-space:nowrap;}
  .bloodgrid input{padding:5px 6px;font-size:12px;}
  .bloodgrid .lastval{font-size:9.5px;color:var(--tabby-dark);margin-top:1px;}
  .bloodresult{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:2px 10px;font-size:12px;}
  .bloodresult .blabel{color:var(--ink-soft);margin-right:2px;}
  .bloodresult .bval.high{color:var(--brick);font-weight:600;}
  .bloodresult .bval.low{color:var(--clinical);font-weight:600;}
  .delbtn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-size:11px;padding:2px 6px;flex-shrink:0;
  }
  .delbtn:hover{color:var(--brick);}

  .healthcard{padding:16px 20px;border-top:1px solid var(--line);background:var(--paper-2);}
  .hc-title{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:600;color:var(--ink-soft);margin:0 0 10px;letter-spacing:.05em;}
  .vetreminder{display:flex;align-items:center;gap:8px;padding:9px 12px;margin-bottom:12px;background:rgba(79,114,133,.12);border:1px solid var(--clinical);border-radius:4px;font-size:13px;color:var(--clinical);}
  .vetreminder b{font-weight:600;}
  .vetreminder svg{width:16px;height:16px;flex-shrink:0;}
  .hc-condition{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .hc-condition label{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .hc-condition input{max-width:340px;border-color:var(--clinical);}
  .medtable{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px;}
  .medtable th{text-align:left;color:var(--ink-soft);font-weight:500;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line-strong);}
  .medtable td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .medname{font-weight:500;}
  .meddose{color:var(--ink-soft);}
  .medprogress{display:inline-flex;gap:3px;vertical-align:middle;}
  .meddot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--clinical);display:inline-block;}
  .meddot.filled{background:var(--clinical);}
  .med-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:11px;}
  .med-del:hover{color:var(--brick);}
  .addmed-form{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;}
  .addmed-form .fitem{flex:1;min-width:90px;}
  .addmed-form label{font-size:10px;color:var(--ink-soft);display:block;margin-bottom:2px;}
  .addmed-btn{padding:7px 14px;border-radius:4px;border:none;background:var(--clinical);color:#fff;font-size:12px;cursor:pointer;font-weight:600;}
  .addmed-btn:hover{filter:brightness(1.08);}

  .syncstate{font-family:'Noto Sans TC',sans-serif;font-size:11px;}
  .syncstate.ok{color:var(--moss);}
  .syncstate.wait{color:var(--tabby-dark);}
  .syncstate.err{color:var(--brick);font-weight:600;}
  .syncstate.off{color:var(--ink-soft);}
  .viewtabs{display:flex;gap:0;border-bottom:1px solid var(--line-strong);background:var(--paper-2);}
  .viewtabs button{flex:1;padding:10px 8px;border:none;background:none;font-family:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;}
  .viewtabs button.active{color:var(--ink);font-weight:600;border-bottom-color:var(--catcolor,var(--tabby));background:var(--card);}
  #viewCharts,#viewReport{padding:16px 16px 24px;}
  .rangebar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .rangebar span{font-size:12px;color:var(--ink-soft);margin-right:2px;}
  .rangebar button,.btn-sm{padding:5px 12px;border:1px solid var(--line-strong);border-radius:14px;background:var(--paper-2);font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer;}
  .rangebar button.on{background:var(--catcolor,var(--tabby));color:#fff;border-color:transparent;}
  .ccard{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:14px;}
  .ccard h3,.rsec h3{font-family:'Noto Serif TC',serif;font-size:14px;margin:0 0 8px;color:var(--ink);font-weight:600;}
  .chips{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .chips b{color:var(--ink);font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .chips .bad{color:var(--brick);}
  .chips .good{color:var(--moss);}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--ink-soft);margin:2px 0 4px;flex-wrap:wrap;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;}
  .chartempty{padding:22px 0;text-align:center;font-size:12.5px;color:var(--ink-soft);}
  svg.chart{width:100%;height:auto;display:block;}
  svg.chart text{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:10.5px;fill:var(--ink-soft);}
  .tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:14px;}
  .tile{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;}
  button.tile{font:inherit;text-align:left;cursor:pointer;color:inherit;}
  button.tile.sel{border-color:var(--catcolor,var(--tabby));background:var(--card);box-shadow:inset 0 0 0 1px var(--catcolor,var(--tabby));}
  .tilelist{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;}
  .tilelist h4{margin:0 0 4px;font-size:12px;color:var(--ink-soft);font-weight:500;}
  .trow{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .trow .td{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);min-width:96px;}
  .trow .tn{color:var(--ink-soft);}
  .prntag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--paper);border:1px dashed var(--ink-soft);color:var(--ink-soft);}
  .med-prn{margin-right:4px;}
  .prnchk{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;flex-basis:100%;}
  .medlist{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .medrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);}
  .medrow.done{opacity:.65;}
  .mrinfo{flex:1;min-width:0;}
  .mrname{font-size:14px;font-weight:600;}
  .mrsub{font-size:11.5px;color:var(--ink-soft);}
  .medtake{padding:9px 16px;border:none;border-radius:6px;background:var(--catcolor,var(--tabby));color:#fff;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;}
  .medrow.done .medtake{background:var(--paper-2);color:var(--ink);border:1px solid var(--line-strong);font-weight:400;}
  .mednote{font-size:11px;color:var(--ink-soft);font-weight:400;line-height:1.3;}
  .mededitbox{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:var(--card);border:1px solid var(--line-strong);border-radius:6px;}
  .mededitbox .fitem{flex:1 1 140px;}
  .mededitbtns{flex-basis:100%;}
  .tile .n{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;}
  .tile .l{font-size:11px;color:var(--ink-soft);}
  .barsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
  .rhead{border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px;}
  .rhead h2{font-family:'Noto Serif TC',serif;font-size:20px;margin:0;}
  .rhead .rmeta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .rsec{margin-bottom:16px;}
  table.rtable{width:100%;border-collapse:collapse;font-size:12px;}
  table.rtable th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line-strong);}
  table.rtable td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  td.hi,span.hi{color:var(--brick);font-weight:600;}
  td.lo,span.lo{color:var(--clinical);font-weight:600;}
  .rnote{font-size:11px;color:var(--ink-soft);margin-top:14px;}
  .ractions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .ractions button{padding:8px 16px;border-radius:4px;border:none;background:var(--catcolor,var(--tabby));color:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;}
  .ractions button.alt{background:var(--paper-2);color:var(--ink);border:1px solid var(--line-strong);}
  @media print{
    @page{size:A4;margin:12mm;}
    body{background:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .masthead,.cattabs,#addcatArea,.viewtabs,.noprint,#viewRecord,#viewCharts{display:none !important;}
    .wrap{padding:0;max-width:none;}
    .board{border:none;}
    #viewReport{padding:0;display:block !important;}
    .rsec{break-inside:avoid;}
  }
  #pixcat{position:fixed;right:8px;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;}
  #pixcat .pcbody{pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;width:84px;height:84px;-webkit-tap-highlight-color:transparent;}
  #pixcat svg{width:100%;height:100%;display:block;image-rendering:pixelated;}
  #pixcat .pcbubble{pointer-events:auto;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:5px 9px;margin:0 6px 4px 0;font-size:12px;color:var(--ink);max-width:190px;position:relative;box-shadow:2px 2px 0 var(--ink);}
  #pixcat .pcbubble.sad{border-color:var(--brick);box-shadow:2px 2px 0 var(--brick);color:var(--brick);}
  #pixcat .pcbubble[hidden]{display:none;}
  #pixcat.happy .pcbody{animation:pcbob 1.4s steps(2,end) infinite;}
  #pixcat.sad .pcbody{animation:pcsway 2.4s steps(2,end) infinite;}
  @keyframes pcbob{50%{transform:translateY(-4px);}}
  @keyframes pcsway{50%{transform:translateY(2px);}}
  @media (prefers-reduced-motion:reduce){#pixcat .pcbody{animation:none !important;}}
  body{padding-bottom:96px;}
  @media print{#pixcat{display:none !important;}}
  @media(max-width:640px){
    .grid{grid-template-columns:1fr;}
    .panel.stamps{border-right:none;border-bottom:1px solid var(--line);}
    .medtable{display:block;overflow-x:auto;white-space:nowrap;}
  }
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0">
  <filter id="inkTexture" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="3"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"/>
  </filter>
</svg>

<div class="wrap">
  <div class="masthead">
    <h1>貓貓日記</h1>
    <div class="sub"><span id="todayLabel"></span> · <span id="syncState" class="syncstate"></span></div>
  </div>

  <div class="cattabs" id="cattabs"></div>
  <div id="addcatArea"></div>

  <div class="board" id="board" style="display:none">
    <div class="viewtabs noprint" id="viewtabs">
      <button data-view="record" class="active">記錄</button>
      <button data-view="charts">走勢圖</button>
      <button data-view="report">醫生報告</button>
    </div>
    <div id="viewRecord">
    <div class="datebar">
      <button id="prevDay">‹</button>
      <div class="datelabel" id="dateLabel"></div>
      <button id="nextDay">›</button>
      <button class="today-btn" id="todayBtn">今日</button>
    </div>
    <div class="grid">
      <div class="panel stamps">
        <h2>快速蓋章</h2>
        <div class="stampgrid" id="stampgrid"></div>
        <div id="quickformArea"></div>
      </div>
      <div class="panel timeline">
        <h2>今日時間線</h2>
        <div id="timeline"></div>
      </div>
    </div>
    <div class="healthcard" id="healthcard"></div>
    <div class="stats" id="stats"></div>
    </div>
    <div id="viewCharts" hidden></div>
    <div id="viewReport" hidden></div>
  </div>

  <div class="empty" id="noCat" style="display:none">仲未有貓貓資料 —— 撳上面「+ 加隻貓」開始記錄啦。</div>
</div>

<div id="pixcat" class="noprint" hidden></div>
<script>

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function nowTimeStr(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDateLabel(ds){
  const d=new Date(ds+'T00:00:00');
  const wd=['日','一','二','三','四','五','六'][d.getDay()];
  return ds+'（星期'+wd+'）';
}


const LOCAL_KEYS_PREFIXES=['cats','entries:'];
let store={};
let remoteMode=false;
let dirty=false;
let pushTimer=null;
let pushing=false;

function setSync(text, cls){
  const el=document.getElementById('syncState');
  if(el){ el.textContent=text; el.className='syncstate '+(cls||''); }
}
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function lsAllData(){
  const out={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(LOCAL_KEYS_PREFIXES.some(p=>k===p||k.startsWith(p))){ out[k]=JSON.parse(localStorage.getItem(k)); }
    }
  }catch(e){}
  return out;
}

const SUPABASE_URL = 'https://bmcbisvprofjscsnfrdz.supabase.co';

const TABLE = 'diary';
let dirtyKeys = new Set();

function sbConfigured(){ return SUPABASE_KEY && !SUPABASE_KEY.startsWith('PASTE_'); }
function sbHeaders(extra){
  const h = Object.assign({ 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' }, extra||{});
  if(!SUPABASE_KEY.startsWith('sb_')) h['Authorization'] = 'Bearer ' + SUPABASE_KEY;
  return h;
}
async function sbFetchAll(){
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?select=key,value', { headers: sbHeaders(), cache: 'no-store' });
  if(!r.ok) throw new Error('GET ' + r.status);
  const rows = await r.json();
  const out = {};
  rows.forEach(row => { if(row.value !== null && row.value !== undefined) out[row.key] = row.value; });
  return { out, count: rows.length };
}
async function sbUpsert(keys){
  const now = new Date().toISOString();
  const rows = keys.map(k => ({ key: k, value: (k in store) ? store[k] : null, updated_at: now }));
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?on_conflict=key', {
    method: 'POST',
    headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify(rows),
    keepalive: JSON.stringify(rows).length < 60000
  });
  if(!r.ok) throw new Error('POST ' + r.status);
}

async function initStorage(){
  if(!sbConfigured()){
    remoteMode=false; store=lsAllData(); setSync('未設定 Supabase key，只存本機','err'); return;
  }
  try{
    const { out, count } = await sbFetchAll();
    remoteMode = true;
    store = out;
    if(count === 0){
      const local = lsAllData();
      if(local.cats && local.cats.length){
        store = local;
        Object.keys(local).forEach(k => dirtyKeys.add(k));
        schedulePush(0);
      }
    }
    setSync('已同步','ok');
  }catch(e){
    console.error(e);
    remoteMode=false; store=lsAllData(); setSync('連唔到資料庫，只存本機','off');
  }
}

function schedulePush(delay){
  if(!remoteMode) return;
  dirty=true;
  setSync('等緊同步…','wait');
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushNow, delay===undefined?1500:delay);
}
async function pushNow(){
  if(!remoteMode || pushing || !dirtyKeys.size) return;
  pushing=true;
  clearTimeout(pushTimer);
  const keys = Array.from(dirtyKeys);
  try{
    dirtyKeys.clear();
    dirty = false;
    setSync('同步中…','wait');
    await sbUpsert(keys);
    setSync(dirtyKeys.size ? '等緊同步…' : '已同步', dirtyKeys.size ? 'wait' : 'ok');
  }catch(e){
    console.error(e);
    keys.forEach(k => dirtyKeys.add(k));
    dirty = true;
    setSync('同步失敗，會再試','err');
    pushing=false;
    pushTimer=setTimeout(pushNow,8000);
    return;
  }
  pushing=false;
  if(dirtyKeys.size) schedulePush();
  else dirty = false;
}

async function safeGet(key){
  return key in store ? store[key] : null;
}
async function safeSet(key,val){
  store[key]=JSON.parse(JSON.stringify(val));
  lsSet(key,val);
  dirtyKeys.add(key);
  schedulePush();
}
async function safeDelete(key){
  delete store[key];
  lsDel(key);
  dirtyKeys.add(key);
  schedulePush();
}

async function refreshFromRemote(){
  if(!remoteMode || dirtyKeys.size || pushing) return;
  try{
    const { out } = await sbFetchAll();
    if(dirtyKeys.size || pushing) return;
    store = out;
    cats=(store.cats)||[];
    cats.forEach(c=>{ c.condition=c.condition||''; c.medications=c.medications||[]; });
    entriesByCat={};
    if(!cats.find(c=>c.id===activeCatId)) activeCatId=cats.length?cats[0].id:null;
    renderCatTabs();
    if(activeCatId){ await ensureEntriesLoaded(activeCatId); }
    render();
    setSync('已同步','ok');
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(dirtyKeys.size) pushNow(); }
  else { refreshFromRemote(); }
});
window.addEventListener('pagehide',()=>{ if(dirtyKeys.size) pushNow(); });

async function loadAll(){
  await initStorage();
  cats = (await safeGet('cats')) || [];

  if(cats.length){ activeCatId = cats[0].id; }

}
async function ensureEntriesLoaded(catId){
  if(!(catId in entriesByCat)){
    entriesByCat[catId] = (await safeGet('entries:'+catId)) || [];
  }
}

function renderCatTabs(){
  const wrap = document.getElementById('cattabs');
  wrap.innerHTML = '';
  cats.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'cattab' + (c.id===activeCatId?' active':'');
    el.style.setProperty('--catcolor', c.color);
    el.innerHTML = '<span class="dot"></span><span>'+escapeHtml(c.name)+'</span><span class="delcat" title="刪除呢隻貓嘅資料">✕</span>';
    el.onclick = async ()=>{ activeCatId = c.id; openCategory=null; await ensureEntriesLoaded(c.id); render(); };
    el.querySelector('.delcat').onclick = (e)=>{ e.stopPropagation(); deleteCat(c); };
    wrap.appendChild(el);
  });
  const add = document.createElement('div');
  add.className = 'cattab addnew';
  add.textContent = '+ 加隻貓';
  add.onclick = toggleAddCatForm;
  wrap.appendChild(add);
}

async function deleteCat(c){
  const ok = confirm('確定要刪除「'+c.name+'」同佢所有記錄？呢個動作刪咗就冚唔返。');
  if(!ok) return;
  cats = cats.filter(x=>x.id!==c.id);
  await safeSet('cats', cats);
  await safeDelete('entries:'+c.id);
  delete entriesByCat[c.id];
  if(activeCatId===c.id){
    activeCatId = cats.length ? cats[0].id : null;
    if(activeCatId) await ensureEntriesLoaded(activeCatId);
  }
  renderCatTabs();
  render();
}

function toggleAddCatForm(){
  const area = document.getElementById('addcatArea');
  if(area.innerHTML){ area.innerHTML=''; return; }
  let chosen = CAT_COLORS[cats.length % CAT_COLORS.length];
  area.innerHTML = '<div class="addcat-form">'+
    '<input type="text" id="newCatName" placeholder="貓貓個名">'+
    '<div class="swatches" id="swatches"></div>'+
    '<button class="stampsubmit" style="width:auto;padding:8px 16px" id="saveCatBtn">加入</button>'+
  '</div>';
  const sw = document.getElementById('swatches');
  CAT_COLORS.forEach(col=>{
    const s = document.createElement('div');
    s.className='swatch'+(col===chosen?' sel':'');
    s.style.background=col;
    s.onclick=()=>{ chosen=col; [...sw.children].forEach(c=>c.classList.remove('sel')); s.classList.add('sel'); };
    sw.appendChild(s);
  });
  document.getElementById('saveCatBtn').onclick = async ()=>{
    const name = document.getElementById('newCatName').value.trim();
    if(!name) return;
    const id = 'cat_'+Date.now();
    cats.push({id,name,color:chosen,condition:'',medications:[]});
    await safeSet('cats', cats);
    entriesByCat[id] = [];
    activeCatId = id;
    area.innerHTML = '';
    renderCatTabs();
    render();
  };
}

function nextVetDate(cat){
  const list = entriesByCat[cat.id]||[];
  const dates = list.filter(e=>e.type==='vet' && e.fields.nextDate).map(e=>e.fields.nextDate);
  const today = todayStr();
  const future = dates.filter(d=>d>=today).sort();
  return future.length ? future[0] : null;
}

      : '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px">仲未有用藥記錄，落面加返啲藥。</div>') +
    '<div class="addmed-form">'+
      '<div class="fitem"><label>藥物名</label><input type="text" id="medName" placeholder="例:Furosemide"></div>'+
      '<div class="fitem"><label>細字註解（可留空）</label><input type="text" id="medNote" placeholder="例:去水丸"></div>'+
      '<div class="fitem"><label>劑量</label><input type="text" id="medDose" placeholder="例:10mg 1粒"></div>'+
      '<div class="fitem" style="max-width:90px"><label>每日次數</label><input type="number" id="medFreq" value="1" min="1"></div>'+
      '<label class="prnchk"><input type="checkbox" id="medPrn"> 有需要先食（唔計入每日完成）</label>'+
      '<button class="addmed-btn" id="addMedBtn">加藥</button>'+
    '</div>';

  document.getElementById('conditionInput').onchange = async (e)=>{
    cat.condition = e.target.value.trim();
    await safeSet('cats', cats);
  };
  el.querySelectorAll('.med-edit').forEach(btn=>{
    btn.onclick = ()=>{ editingMedId=btn.dataset.mid; renderHealthCard(cat); };
  });
  const emSave=document.getElementById('em_save');
  if(emSave){
    document.getElementById('em_cancel').onclick=()=>{ editingMedId=null; renderHealthCard(cat); };
    emSave.onclick=async ()=>{
      const m=(cat.medications||[]).find(x=>x.id===editingMedId); if(!m){ editingMedId=null; return; }
      const nn=document.getElementById('em_name').value.trim(); if(!nn) return;
      const oldName=m.name;
      m.name=nn; m.note=document.getElementById('em_note').value.trim();
      m.dose=document.getElementById('em_dose').value.trim();
      m.freq=parseInt(document.getElementById('em_freq').value)||1;
      m.prn=document.getElementById('em_prn').checked;
      if(oldName!==nn){
        // 舊記錄跟住改名，進度先唔會歸零
        const list=entriesByCat[cat.id]||[]; let changed=false;
        list.forEach(e=>{ if(e.type==='med' && e.fields && e.fields.name===oldName){ e.fields.name=nn; changed=true; } });
        if(changed) await safeSet('entries:'+cat.id, list);
      }
      await safeSet('cats', cats);
      editingMedId=null; render();
    };
  }
  el.querySelectorAll('.med-del[data-mid]:not(.med-edit)').forEach(btn=>{
    btn.onclick = async ()=>{
      cat.medications = cat.medications.filter(m=>m.id!==btn.dataset.mid);
      await safeSet('cats', cats);
      render();
    };
  });
  document.getElementById('addMedBtn').onclick = async ()=>{
    const name = document.getElementById('medName').value.trim();
    const dose = document.getElementById('medDose').value.trim();
    const freq = parseInt(document.getElementById('medFreq').value)||1;
    if(!name) return;
    cat.medications = cat.medications||[];
    cat.medications.push({id:'med_'+Date.now(), name, dose, freq, note:document.getElementById('medNote').value.trim(), prn:!!document.getElementById('medPrn').checked});
    await safeSet('cats', cats);
    render();
  };
}

function getWeightHistory(cat){
  return (entriesByCat[cat.id]||[])
    .filter(e=>e.type==='weight' && e.fields.value && !isNaN(parseFloat(e.fields.value)))
    .map(e=>({...e, value:parseFloat(e.fields.value)}))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

      '<div class="medlist">'+rows+'</div>'+

    area.innerHTML = '<div class="quickform">'+
      '<div class="frow"><div class="fitem"><label>時間</label><input type="time" id="f_time" value="'+nowTimeStr()+'"></div></div>'+

      '<div class="bloodgrid">'+cbcHtml+'</div>'+

  document.getElementById('stampSubmitBtn').onclick = ()=>submitEntry(cat, cfg);

async function submitEntry(cat, cfg){
  const time = document.getElementById('f_time').value || nowTimeStr();
  const note = document.getElementById('f_note').value.trim();
  let fields = {};
  if(cfg.id==='med'){
    const medId = document.getElementById('f_medId').value;
    const med = (cat.medications||[]).find(m=>m.id===medId);
    if(med) fields = {name:med.name, dose:med.dose};
  } else if(cfg.id==='bloodtest'){
    BLOOD_PARAMS.forEach(p=>{
      const el = document.getElementById('bt_'+p.key);
      if(el && el.value.trim()!==''){ fields[p.key] = el.value.trim(); }
    });
  } else {
    cfg.fields.forEach(f=>{
      const el = document.getElementById('f_'+f.key);
      if(el) fields[f.key] = el.value.trim ? el.value.trim() : el.value;
    });
  }
  const entry = {
    id:'e_'+Date.now(),
    type:cfg.id,
    date:selectedDate,
    time,
    fields,
    note
  };
  entriesByCat[cat.id] = entriesByCat[cat.id] || [];
  entriesByCat[cat.id].push(entry);
  entriesByCat[cat.id].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  await safeSet('entries:'+cat.id, entriesByCat[cat.id]);
  openCategory = null;
  render();
}

function renderStats(cat){
  const list = (entriesByCat[cat.id]||[]).filter(e=>e.date===selectedDate);
  const feed = list.filter(e=>e.type==='feed').length;
  const litter = list.filter(e=>e.type==='litter').length;
  const playMin = list.filter(e=>e.type==='play').reduce((s,e)=>s+(parseInt(e.fields.duration)||0),0);
  const medCount = list.filter(e=>e.type==='med').length;
  const vetCount = list.filter(e=>e.type==='vet').length;
  const bloodCount = list.filter(e=>e.type==='bloodtest').length;
  const stats = document.getElementById('stats');
  stats.innerHTML = '';
  [['餵食次數',feed],['如廁次數',litter],['玩耍分鐘',playMin],['食藥次數',medCount],['睇醫生',vetCount],['驗血',bloodCount],['今日記錄',list.length]].forEach(([l,n])=>{
    const el = document.createElement('div');
    el.className='stat';
    el.innerHTML = '<div class="n">'+n+'</div><div class="l">'+l+'</div>';

function bloodDetailHtml(fields){
  const items = BLOOD_PARAMS.filter(p=>fields[p.key]!==undefined && fields[p.key]!=='').map(p=>{
    const val = parseFloat(fields[p.key]);
    let cls='';
    if(p.ref && !isNaN(val)){ if(val<p.ref[0]) cls='low'; else if(val>p.ref[1]) cls='high'; }
    return '<div><span class="blabel">'+p.label.split(' ')[0]+'</span><span class="bval '+cls+'">'+fields[p.key]+'</span></div>';
  });
  return items.length ? '<div class="bloodresult">'+items.join('')+'</div>' : '';
}

function renderTimeline(cat){
  const tl = document.getElementById('timeline');
  const list = (entriesByCat[cat.id]||[]).filter(e=>e.date===selectedDate);
  if(!list.length){
    tl.innerHTML = '<div class="empty">呢一日仲未有記錄，撳左邊個掣蓋個章啦。</div>';
    return;
  }
  const cfgMap = {}; CATEGORIES.forEach(c=>cfgMap[c.id]=c);
  const weightHist = getWeightHistory(cat);
  tl.innerHTML = list.map((e,idx)=>{
    const cfg = cfgMap[e.type];
    const tilt = (idx%2===0? -3:3) + (idx%3);
    let detail;
    if(e.type==='weight' && e.fields.value && !isNaN(parseFloat(e.fields.value))){
      const val = parseFloat(e.fields.value);
      const histIdx = weightHist.findIndex(w=>w.id===e.id);
      const prev = histIdx>0 ? weightHist[histIdx-1] : null;
      let diffHtml = '';
      if(prev){
        const diff = val - prev.value;
        const diffAbs = Math.abs(diff).toFixed(2).replace(/\.?0+$/,'');
        if(diff>0.005) diffHtml = ' <span class="wdiff up">▲ +'+diffAbs+'kg（上次'+prev.value+'kg）</span>';
        else if(diff<-0.005) diffHtml = ' <span class="wdiff down">▼ -'+diffAbs+'kg（上次'+prev.value+'kg）</span>';
        else diffHtml = ' <span class="wdiff same">→ 不變（上次'+prev.value+'kg）</span>';
      }
      detail = val+'kg'+diffHtml;
    } else if(e.type==='bloodtest'){
      detail = bloodDetailHtml(e.fields);
    } else if(e.type==='resp'){
      const rate = parseFloat(e.fields.rate);
      const state = e.fields.state || '';
      const th = RESP_THRESHOLD[state] || 35;
      const over = !isNaN(rate) && rate>th;
      detail = (over ? '<span class="bval high">'+escapeHtml(e.fields.rate)+'</span>' : escapeHtml(e.fields.rate||''))+
        ' 下/分鐘 · '+escapeHtml(state)+
        (over ? ' <span class="bval high">⚠ 超過'+th+'下</span>' : '');
    } else {
      const detailParts = Object.entries(e.fields).filter(([k,v])=>v).map(([k,v])=>escapeHtml(v));
      detail = detailParts.join(' · ');
    }
    return '<div class="entry" style="--tilt:'+tilt+'deg">'+
      '<div class="stampicon" style="--c:'+cat.color+'">'+ICONS[e.type]+'</div>'+
      '<div class="entrybody">'+
        '<div class="entrytop"><span class="entrytype">'+cfg.label+'</span><span class="entrytime">'+e.time+'</span></div>'+
        (detail?'<div class="entrydetail">'+detail+'</div>':'')+
        (e.note?'<div class="entrynote">「'+escapeHtml(e.note)+'」</div>':'')+
      '</div>'+
      '<button class="delbtn" data-id="'+e.id+'">刪除</button>'+
    '</div>';
  }).join('');
  tl.querySelectorAll('.delbtn').forEach(btn=>{
    btn.onclick = async ()=>{
      entriesByCat[cat.id] = entriesByCat[cat.id].filter(e=>e.id!==btn.dataset.id);
      await safeSet('entries:'+cat.id, entriesByCat[cat.id]);
      render();
    };
  });
}

// ================= 走勢圖 / 統計 / 醫生報告 =================
let currentView='record', chartRange=90, bloodParam=null, tileType=null;
const DAY=86400000;
const TYPE_LABEL={}; CATEGORIES.forEach(c=>TYPE_LABEL[c.id]=c.label);

function tsOf(e){ return new Date(e.date+'T'+(e.time||'00:00')+':00').getTime(); }
function fmtMD(t){ const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate(); }
function fmtN(v){ return String(Math.round(v*100)/100); }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function entriesOf(cat,type){ return (entriesByCat[cat.id]||[]).filter(e=>e.type===type).sort((a,b)=>tsOf(a)-tsOf(b)); }
function inRange(list,days){ if(!days) return list; const from=Date.now()-days*DAY; return list.filter(e=>tsOf(e)>=from); }
function lastNDays(n){ const out=[]; const d=new Date(); d.setHours(12,0,0,0); for(let i=n-1;i>=0;i--){ const x=new Date(d.getTime()-i*DAY); out.push(dstr(x)); } return out; }
function bloodFlag(p,v){ if(!p.ref||isNaN(v)) return ''; return v<p.ref[0]?'lo':(v>p.ref[1]?'hi':''); }
function bloodVal(e,key){ const v=e.fields[key]; return (v===undefined||v==='')?null:parseFloat(v); }
function respOver(e){ const r=parseFloat(e.fields.rate); const th=RESP_THRESHOLD[e.fields.state]||35; return !isNaN(r) && r>th; }

function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function yTicks(lo,hi,n){
  if(hi===lo){ hi=lo+1; lo=lo-1; }
  const step=niceStep((hi-lo)/n);
  const a=Math.floor(lo/step+1e-9)*step, b=Math.ceil(hi/step-1e-9)*step;
  const out=[]; for(let v=a; v<=b+step/2; v+=step) out.push(Math.round(v/step)*step);
  return out;
}

function lineChart(o){
  const W=o.width||600, H=o.height||200, m={l:44,r:14,t:12,b:26};
  const pts=[]; o.series.forEach(s=>s.points.forEach(p=>pts.push(p)));
  if(!pts.length) return '<div class="chartempty">呢個範圍未有數據</div>';
  const ys=pts.map(p=>p.v); (o.hlines||[]).forEach(h=>ys.push(h.y)); if(o.band) ys.push(o.band[0],o.band[1]);
  let lo=Math.min(...ys), hi=Math.max(...ys); const pv=((hi-lo)||1)*0.12; lo-=pv; hi+=pv;
  const ticks=yTicks(lo,hi,4); lo=ticks[0]; hi=ticks[ticks.length-1];
  let t0=o.t0!==undefined?o.t0:Math.min(...pts.map(p=>p.t)), t1=o.t1!==undefined?o.t1:Math.max(...pts.map(p=>p.t));
  if(t1===t0){ t0-=DAY*3; t1+=DAY*3; }
  const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r), Y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b);
  let g='';
  ticks.forEach(v=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${Y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`; });
  for(let i=0;i<=4;i++){ const t=t0+(t1-t0)*i/4; g+=`<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?'start':(i===4?'end':'middle')}">${fmtMD(t)}</text>`; }
  if(o.band){ const yb1=Y(Math.min(o.band[1],hi)), yb2=Y(Math.max(o.band[0],lo)); g+=`<rect x="${m.l}" y="${yb1}" width="${W-m.l-m.r}" height="${Math.max(0,yb2-yb1)}" fill="rgba(116,133,105,.20)"/><text x="${W-m.r-3}" y="${yb1+11}" text-anchor="end" style="fill:var(--moss)">參考範圍 ${fmtN(o.band[0])}–${fmtN(o.band[1])}</text>`; }
  (o.hlines||[]).forEach(h=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="var(--brick)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="${W-m.r-3}" y="${Y(h.y)-4}" text-anchor="end" style="fill:var(--brick)">${h.label}</text>`; });
  o.series.forEach(s=>{
    const sp=s.points.slice().sort((a,b)=>a.t-b.t);
    if(sp.length>1){ g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dashed?'stroke-dasharray="2 3"':''} stroke-linejoin="round" points="${sp.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"/>`; }
    sp.forEach(p=>{ g+=`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${p.flag?4.5:3.5}" fill="${p.flag?'var(--brick)':s.color}" stroke="var(--card)" stroke-width="1"><title>${escapeHtml(p.tip||'')}</title></circle>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(o.aria||'走勢圖')}">${g}</svg>`;
}

function barChart(o){
  const W=o.width||600, H=o.height||140, m={l:34,r:8,t:10,b:22};
  const n=o.data.length; if(!n) return '<div class="chartempty">未有數據</div>';
  let mx=Math.max(...o.data.map(d=>d.value),o.minMax||1);
  const ticks=yTicks(0,mx,3); mx=ticks[ticks.length-1];
  const bw=(W-m.l-m.r)/n, Y=v=>m.t+(1-v/mx)*(H-m.t-m.b);
  let g='';
  ticks.forEach(v=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-5}" y="${Y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`; });
  const every=Math.ceil(n/7);
  o.data.forEach((d,i)=>{
    const x=m.l+i*bw+bw*0.15, w=bw*0.7, y=Y(d.value);
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,(H-m.b)-y).toFixed(1)}" rx="1.5" fill="${o.color}"><title>${escapeHtml(d.label+'：'+fmtN(d.value)+(o.unit||''))}</title></rect>`;
    if(i%every===0||i===n-1){ const mm=d.label.split('-'); g+=`<text x="${(m.l+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${+mm[1]}/${+mm[2]}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(o.aria||'統計圖')}">${g}</svg>`;
}

function weightSeries(cat,days,color){
  const list=inRange(entriesOf(cat,'weight'),days).filter(e=>!isNaN(parseFloat(e.fields.value)));
  return { list, series:[{name:'體重',color,points:list.map(e=>({t:tsOf(e),v:parseFloat(e.fields.value),tip:e.date+' '+fmtN(parseFloat(e.fields.value))+'kg'}))}] };
}
function respSeries(cat,days,color){
  const list=inRange(entriesOf(cat,'resp'),days).filter(e=>!isNaN(parseFloat(e.fields.rate)));
  const mk=(state,col,dashed)=>({name:state,color:col,dashed,points:list.filter(e=>e.fields.state===state).map(e=>({t:tsOf(e),v:parseFloat(e.fields.rate),flag:respOver(e),tip:e.date+' '+e.time+' '+state+' '+e.fields.rate+' 下/分鐘'+(respOver(e)?'（超標）':'')}))});
  return { list, series:[mk('清醒',color,false), mk('睡覺','var(--clinical)',true)] };
}
function respStats(list){
  const over=list.filter(respOver).length;
  const avg=st=>{ const a=list.filter(e=>e.fields.state===st).map(e=>parseFloat(e.fields.rate)); return a.length?a.reduce((x,y)=>x+y,0)/a.length:null; };
  return { over, total:list.length, avgAwake:avg('清醒'), avgSleep:avg('睡覺') };
}
function dailyCounts(cat,days){
  const ds=lastNDays(days), all=entriesByCat[cat.id]||[];
  const meds=regularMeds(cat); const expected=meds.reduce((s,m)=>s+(m.freq||1),0);
  const by=(type)=>ds.map(d=>({label:d,value:all.filter(e=>e.type===type&&e.date===d).length}));
  return {
    ds,
    feed:by('feed'), litter:by('litter'),
    play:ds.map(d=>({label:d,value:all.filter(e=>e.type==='play'&&e.date===d).reduce((s,e)=>s+(parseInt(e.fields.duration)||0),0)})),
    med: expected? ds.map(d=>{ let given=0; meds.forEach(m=>{ given+=Math.min(m.freq||1, all.filter(e=>e.type==='med'&&e.date===d&&e.fields.name===m.name).length); }); return {label:d,value:Math.round(given/expected*100)}; }) : null
  };
}

}

function csvEscape(v){ v=String(v==null?'':v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function entrySummary(e){
  if(e.type==='bloodtest') return BLOOD_PARAMS.filter(p=>e.fields[p.key]!==undefined&&e.fields[p.key]!=='').map(p=>p.label.split(' ')[0]+'='+e.fields[p.key]).join('; ');
  if(e.type==='weight') return (e.fields.value||'')+' kg';
  if(e.type==='resp') return (e.fields.state||'')+' '+(e.fields.rate||'')+' 下/分鐘';
  if(e.type==='med') return (e.fields.name||'')+' '+(e.fields.dose||'');
  return Object.values(e.fields||{}).filter(Boolean).join(' · ');
}
function downloadCSV(cat){
  const rows=[['日期','時間','類型','內容','備註']];
  (entriesByCat[cat.id]||[]).slice().sort((a,b)=>tsOf(a)-tsOf(b)).forEach(e=>rows.push([e.date,e.time,TYPE_LABEL[e.type]||e.type,entrySummary(e),e.note||'']));
  const csv='﻿'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='貓貓日記_'+cat.name+'_'+todayStr()+'.csv';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

  el.innerHTML=html;
  document.getElementById('btnPrint').onclick=()=>window.print();

const PIX_PAL={o:'#5a4636',t:'#d8b48c',c:'#f4e4d0',w:'#fffaf2',e:'#3b4d70',h:'#ffffff',n:'#e48e9c',p:'#f2a9b4',m:'#5a4636',b:'#8fc3ea',r:'#d4513f',g:'#7c7c8a',y:'#f2c14e'};
const PIX_BASE=[
'................',
'..oo........oo..',
'.opto......otpo.',
'.ottooooooootto.',
'.otttccccccttto.',
'.occcccccccccco.',
'.occcccccccccco.',
'.occcccccccccco.',
'.occccccnnccccco',
'.occcccccccccco.',
'..owwwwwwwwwwo..',
'.owwwwwwwwwwwwo.',
'.owwwcwwwwcwwwo.',
'.owwwwwwwwwwwwoo',
'.owwoowwwwoowwo.',
'..oooooooooooo..'
];
function pixGrid(mood){
  const g=PIX_BASE.map(r=>r.split(''));
  const set=(x,y,ch)=>{ g[y][x]=ch; };
  if(mood==='happy'){
    [[4,6],[5,6],[4,7],[5,7],[10,6],[11,6],[10,7],[11,7]].forEach(([x,y])=>set(x,y,'e'));
    set(4,6,'h'); set(10,6,'h');
    set(3,8,'p'); set(12,8,'p');
    set(6,9,'m'); set(9,9,'m'); set(7,10,'m'); set(8,10,'m');
  } else {
    // 愁眉苦臉
    set(4,5,'o'); set(5,5,'o'); set(10,5,'o'); set(11,5,'o');
    set(3,5,'c'); set(12,5,'c');
    [[4,7],[5,7],[10,7],[11,7]].forEach(([x,y])=>set(x,y,'e'));
    set(4,6,'e'); set(11,6,'e');
    set(4,8,'b'); set(4,9,'b'); set(11,8,'b');
    set(6,10,'m'); set(9,10,'m'); set(7,9,'m'); set(8,9,'m');
    // 細烏雲
    set(1,0,'g'); set(2,0,'g'); set(3,0,'g'); set(2,1,'g'); set(1,1,'g'); set(0,1,'g');
  }
  return g;
}
function pixSvg(mood){
  const g=pixGrid(mood); let r='';
  g.forEach((row,y)=>row.forEach((ch,x)=>{ if(ch!=='.' && PIX_PAL[ch]) r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PIX_PAL[ch]}"/>`; }));
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
let pixHidden=false, pixLast='';
function medStatus(cat){
  const meds=regularMeds(cat); const expected=meds.reduce((s,m)=>s+(m.freq||1),0);
  const t=todayStr(); const all=entriesByCat[cat.id]||[];
  let given=0; meds.forEach(m=>{ given+=Math.min(m.freq||1, all.filter(e=>e.type==='med'&&e.date===t&&e.fields.name===m.name).length); });
  return {expected,given};
}
function updatePixCat(cat){
  const el=document.getElementById('pixcat'); if(!el) return;
  if(!cat){ el.hidden=true; return; }
  const st=medStatus(cat); const left=st.expected-st.given;
  const mood=(st.expected>0 && left>0)?'sad':'happy';
  const msg= mood==='sad' ? `${cat.name}:仲有 ${left} 次藥未食…` : (st.expected>0 ? `${cat.name}:食哂藥喇,少少開心 ♥` : `${cat.name}:喵~`);
  const key=cat.id+'|'+mood+'|'+msg+'|'+pixHidden;
  el.hidden=false; el.className=mood+' noprint';
  if(key===pixLast) return; pixLast=key;
  el.innerHTML=`<div class="pcbubble ${mood}" ${pixHidden?'hidden':''}>${escapeHtml(msg)}</div><button class="pcbody" type="button" aria-label="${escapeHtml(msg)}">${pixSvg(mood)}</button>`;
  el.querySelector('.pcbody').onclick=()=>{ pixHidden=!pixHidden; pixLast=''; updatePixCat(cat); };
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function shiftDate(days){
  const d = new Date(selectedDate+'T00:00:00');
  d.setDate(d.getDate()+days);
  selectedDate = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  render();
}
document.getElementById('prevDay').onclick = ()=>shiftDate(-1);
document.getElementById('nextDay').onclick = ()=>shiftDate(1);
document.getElementById('todayBtn').onclick = ()=>{ selectedDate = todayStr(); render(); };

loadAll();
</script>
</body>
</html>
